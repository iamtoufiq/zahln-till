appId: de.zahln.till
name: A till restarted while showing a QR opens straight on that order, and back does not abandon it
---
- runFlow: flows/sign-in.yaml
- runFlow: flows/ring-up.yaml
- stopApp
- launchApp:
    clearState: false
- assertVisible:
    id: "order-qr"
- copyTextFrom:
    id: "order-id"
- assertTrue: ${maestro.copiedText == output.orderId}
# The API cannot cancel an order, so back must not leave an open QR behind.
- back
- assertVisible:
    id: "order-qr"
# iOS has no back button but pops screens with a swipe from the left edge.
- swipe:
    start: 0%, 50%
    end: 80%, 50%
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    id: "order-qr"
